name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}" -replace '^v', ''
          }
          echo "VER=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $ver"

      - name: Publish (framework-dependent, win-x64)
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VER }}"
          dotnet publish HipHipParquet.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$ver `
            -p:AssemblyVersion=$ver.0 `
            -p:FileVersion=$ver.0 `
            --output publish

      - name: Build installer (Inno Setup)
        shell: pwsh
        working-directory: installer
        run: |
          $ver = "${{ steps.version.outputs.VER }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc HipHipParquet.iss /DMyAppVersion=$ver /DSourceDir=..\publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VER }}"
          Compress-Archive `
            -Path publish\*, README.md, LICENSE `
            -DestinationPath "HipHipParquet-$ver-Portable.zip"

      - name: Generate checksums
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VER }}"
          $setupExe  = "installer-output\HipHipParquet-$ver-Setup.exe"
          $portableZip = "HipHipParquet-$ver-Portable.zip"
          $lines = @()
          foreach ($f in @($setupExe, $portableZip)) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash
            $name = Split-Path $f -Leaf
            $lines += "$hash  $name"
          }
          $lines | Set-Content "HipHipParquet-$ver-SHA256SUMS.txt"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VER }}
          name: "Hip Hip Parquet v${{ steps.version.outputs.VER }}"
          body: |
            ## Hip Hip Parquet v${{ steps.version.outputs.VER }}

            ### What's Changed

            - **Zoom the workspace** — hold Ctrl and scroll, or use `Ctrl+=` / `Ctrl+-` / `Ctrl+0`, to scale the schema pane, grid, Query Hub and quality panel. The menu bar and status bar stay at native size, and the level is remembered between sessions.
            - **Markdown helper rebuilt on WebView2** — the preview previously rendered in a legacy engine that ignored most of its own stylesheet, so it never matched the app. It now uses the Chromium-based host, follows the light/dark theme, and re-renders when the theme changes.
            - **Mermaid diagrams** — flowcharts, pie charts, state diagrams and timelines render in the markdown preview from a renderer bundled with the app. Nothing is fetched from the network.
            - **Collapsible sections and richer markdown** — `<details>`/`<summary>` disclosures now render, alongside task lists and aligned tables. Raw HTML is filtered through an allow-list so nothing scriptable runs in the preview.
            - **Markdown opens in the workspace** — opening a `.md` file docks the helper alongside your data instead of launching a separate window; **Pop out** moves it to its own window when you want it there.
            - **Accessibility and dialog fixes** — message boxes are now owned by the main window so they centre correctly instead of hiding behind it, `Ctrl+Z` works anywhere in the window rather than only in the grid, long loads can be cancelled, and error messages read in plain language instead of raw exception text.
            - **Menu text fix** — column names, filenames and saved-view names containing an underscore rendered with it missing (`ARR_TIME` appeared as `ARRTIME`).
            - **Dark theme corrections** — the Help dialog and Markdown helper no longer fall back to unthemed defaults in dark mode.

            ### Download

            | File | Description |
            |------|-------------|
            | `HipHipParquet-${{ steps.version.outputs.VER }}-Setup.exe` | Recommended — Windows installer wizard |
            | `HipHipParquet-${{ steps.version.outputs.VER }}-Portable.zip` | Portable — extract and run anywhere |
            | `HipHipParquet-${{ steps.version.outputs.VER }}-SHA256SUMS.txt` | SHA-256 checksums |

            ### Requirements

            - Windows 10 (build 19041) or later, 64-bit
            - [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0/runtime?runtime=desktop&os=windows&arch=x64) — required; install it first if the app does not start

            ### Installation

            **Installer:** Download `Setup.exe` and run it — no other steps required.

            **Portable:** Download the zip, extract to any folder, and run `HipHipParquet.exe`.
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VER, '-') }}
          files: |
            installer-output/HipHipParquet-${{ steps.version.outputs.VER }}-Setup.exe
            HipHipParquet-${{ steps.version.outputs.VER }}-Portable.zip
            HipHipParquet-${{ steps.version.outputs.VER }}-SHA256SUMS.txt
          generate_release_notes: true
