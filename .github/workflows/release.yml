name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}" -replace '^v', ''
          }
          echo "VER=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $ver"

      - name: Publish (framework-dependent, win-x64)
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VER }}"
          dotnet publish HipHipParquet.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$ver `
            -p:AssemblyVersion=$ver.0 `
            -p:FileVersion=$ver.0 `
            --output publish

      - name: Build installer (Inno Setup)
        shell: pwsh
        working-directory: installer
        run: |
          $ver = "${{ steps.version.outputs.VER }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc HipHipParquet.iss /DMyAppVersion=$ver /DSourceDir=..\publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VER }}"
          Compress-Archive `
            -Path publish\*, README.md, LICENSE `
            -DestinationPath "HipHipParquet-$ver-Portable.zip"

      - name: Generate checksums
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VER }}"
          $setupExe  = "installer-output\HipHipParquet-$ver-Setup.exe"
          $portableZip = "HipHipParquet-$ver-Portable.zip"
          $lines = @()
          foreach ($f in @($setupExe, $portableZip)) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash
            $name = Split-Path $f -Leaf
            $lines += "$hash  $name"
          }
          $lines | Set-Content "HipHipParquet-$ver-SHA256SUMS.txt"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Hip Hip Parquet v${{ steps.version.outputs.VER }}"
          body: |
            ## Hip Hip Parquet v${{ steps.version.outputs.VER }}

            ### Download

            | File | Description |
            |------|-------------|
            | `HipHipParquet-${{ steps.version.outputs.VER }}-Setup.exe` | Recommended — Windows installer wizard |
            | `HipHipParquet-${{ steps.version.outputs.VER }}-Portable.zip` | Portable — extract and run anywhere |
            | `HipHipParquet-${{ steps.version.outputs.VER }}-SHA256SUMS.txt` | SHA-256 checksums |

            ### Requirements

            - Windows 10 (build 19041) or later, 64-bit
            - [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0/runtime?runtime=desktop&os=windows&arch=x64) — the installer will prompt if not present

            ### Installation

            **Installer:** Download `Setup.exe` and run it — no other steps required.

            **Portable:** Download the zip, extract to any folder, and run `HipHipParquet.exe`.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            installer-output/HipHipParquet-${{ steps.version.outputs.VER }}-Setup.exe
            HipHipParquet-${{ steps.version.outputs.VER }}-Portable.zip
            HipHipParquet-${{ steps.version.outputs.VER }}-SHA256SUMS.txt
          generate_release_notes: true
